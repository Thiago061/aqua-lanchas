{% extends 'base.html' %}
{% block title %}Entrar | Aqua Lanchas{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h1>Entrar</h1>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-accent w-100" type="submit">Acessar sistema</button>
    </form>
    <a href="{% url 'password_reset' %}">Esqueci minha senha</a>
    <hr>
    <p class="mb-2">Ainda não tem uma conta?</p>
    <a class="btn btn-outline-primary w-100" href="{% url 'cadastro' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Cadastre-se agora</a>
  </div>
</section>
{% endblock %}
